services:
  # Service name MUST stay `replay` — the MediaMTX sidecar calls
  # http://replay:8090/api/live/auth for RTMP publish-key validation, and
  # the inlined mediamtx_config below hardcodes that hostname.
  replay:
    image: ghcr.io/humac/replay:latest
    # Uncomment to build locally instead of pulling from GHCR:
    #build: .
    container_name: replay
    # No public `ports:` — Caddy is the single entry point. Other compose
    # services reach this app via the service name `replay:8090` on the
    # internal network. `expose:` documents the port without publishing it.
    expose:
      - "8090"
    env_file:
      - .env.local
    # The image's default UID 10001 can't write to a host bind-mounted /data
    # whose host directory is root- or app_service-owned. Running as root
    # sidesteps the UID-mapping problem and matches the host convention on
    # this server. Switch back to the image default (drop this line) if you
    # ever migrate to a named volume or chown the host dir to 10001.
    user: "0:0"
    environment:
      REPLAY_PORT: 8090
      REPLAY_DATA_DIR: /data
      # Storage tiering: HLS variants + the SQLite DB live on /data (SSD pool;
      # hot path, many small random reads). Raw uploads + finished MP4s live
      # on /originals (HDD pool; large, cold). Comment REPLAY_ORIGINALS_DIR
      # out (and remove the /originals bind mount below) to fall back to the
      # legacy single-volume layout. See docs/DEPLOYMENT.md "Storage tiering".
      REPLAY_ORIGINALS_DIR: /originals/videos
      TMPDIR: /tmp/ffmpeg
      MAX_UPLOAD_SIZE_BYTES: 12884901888
      TRANSCODE_CONCURRENCY: 2
      # NVIDIA GPU — comment the next two lines out when switching to Intel iGPU
      #NVIDIA_VISIBLE_DEVICES: GPU-26ddab77-c658-9829-0ace-90674c97dc87
      #NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Live streaming — internal addresses for the mediamtx sidecar
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      MEDIAMTX_API_URL: http://mediamtx:9997
    volumes:
      - /mnt/apps_ssd/apps/replay:/data
      # Cold-storage volume for raw uploads + finished MP4s. Recommended:
      # a dedicated ZFS dataset on the HDD pool with `recordsize=1M
      # compression=lz4 atime=off` (see docs/DEPLOYMENT.md). Comment out
      # together with the REPLAY_ORIGINALS_DIR env above to disable tiering.
      - /mnt/tank/media/replay:/originals
      # Intel GPU (VAAPI / QSV) — uncomment to expose the iGPU render node
      - /dev/dri:/dev/dri
    # Intel GPU (VAAPI / QSV) — uncomment to pass the render device through
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # Numeric GIDs of the host's video / render groups. Names would be looked
    # up inside the container, which has no `render` group. Defaults match
    # Debian/Ubuntu (video=44); render varies, so set RENDER_GID in .env.local
    # via: RENDER_GID=$(stat -c '%g' /dev/dri/renderD128)
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-107}"
    tmpfs:
      - /tmp/ffmpeg:size=20g,exec
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/auth/check', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # NVIDIA GPU — comment this whole `deploy:` block out when switching to
    # Intel iGPU. Intel VAAPI/QSV does not use `deploy.resources.reservations`;
    # the `devices:` + `group_add:` passthrough above is sufficient.
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          device_ids: ["GPU-26ddab77-c658-9829-0ace-90674c97dc87"]
    #          capabilities: [gpu, video]

  # Caddy — single public entry point for the stack. Caddy serves VOD HLS
  # .ts/.m4s segments directly from the bind-mounted /data volume using
  # sendfile() (saturates 10 GbE far better than uvicorn can) and reverse-
  # proxies everything else to the replay app on the internal network.
  # See ./Caddyfile.
  #
  # Host-published port is 8090 (the same port the replay app used to bind
  # directly) so existing clients, Cloudflare Tunnel rules, and bookmarks
  # keep working unchanged. Caddy listens on :80 inside the container.
  #
  # /data is mounted read-only so a misconfiguration in Caddy can't write
  # into the replay app's data tree. Caddy's own persistence (ACME state,
  # config snapshot) lives at /srv/caddy-data and /srv/caddy-config —
  # outside /data — because Docker can't create a writable mountpoint
  # inside a read-only mount (mkdirat returns EROFS during runc start).
  caddy:
    image: caddy:2-alpine
    container_name: replay-caddy
    # The caddy image picks up these XDG vars for its data + config dirs,
    # so pointing them at /srv keeps everything outside the read-only /data.
    environment:
      XDG_DATA_HOME: /srv/caddy-data
      XDG_CONFIG_HOME: /srv/caddy-config
    ports:
      - "8090:80"
    # Caddyfile is shipped via `configs:` (see below) instead of a host
    # bind-mount, so Komodo and similar deployers that only ship the compose
    # file (without the repo on disk) work out of the box.
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    volumes:
      - /mnt/apps_ssd/apps/replay:/data:ro
      - replay_caddy_data:/srv/caddy-data
      - replay_caddy_config:/srv/caddy-config
    depends_on:
      - replay
    restart: unless-stopped

  # MediaMTX — RTMP ingest (camera push) → LL-HLS output (browser playback).
  # Only RTMP (1935) is exposed publicly; HLS and the control API stay on the
  # internal compose network and are reverse-proxied by `replay` so viewers and
  # admins only need to reach a single origin.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: replay-mediamtx
    ports:
      - "1935:1935"   # RTMP — point your camera here
    expose:
      - "8888"        # LL-HLS (internal only)
      - "9997"        # control API (internal only)
    configs:
      - source: mediamtx_config
        target: /mediamtx.yml
    restart: unless-stopped

  # Cloudflare DDNS — keeps f2014steel-live.jvhlabs.com pointing at the
  # current public IP when the home connection's IP changes. Only the
  # RTMP host needs DDNS — f2014steel.jvhlabs.com flows through a
  # Cloudflare Tunnel (cloudflared), so its A record points at Cloudflare,
  # not the home IP. RTMP can't go through the tunnel, so the camera
  # connects directly to the home IP via this DNS-only record.
  # Token comes from .env.local (CLOUDFLARE_API_TOKEN).
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: replay-cloudflare-ddns
    env_file:
     - .env.local
    environment:
      DOMAINS: f2014steel-live.jvhlabs.com
      PROXIED: "false"
      IP4_PROVIDER: cloudflare.trace
      IP6_PROVIDER: none
      UPDATE_CRON: "@every 5m"
      TZ: UTC
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt:
      - no-new-privileges:true

configs:
  # Inlined so this stack is self-contained — Komodo only needs to ship the
  # compose file, no sibling mediamtx.yml on the host.
  #
  # CANONICAL SOURCE: ./mediamtx.yml in the repo. If you edit MediaMTX config,
  # edit that file first and copy the body into the `content:` block below.
  # docker-compose.yml (NVIDIA variant) still bind-mounts ./mediamtx.yml
  # directly, so keeping the repo copy authoritative avoids drift.
  mediamtx_config:
    content: |
      logLevel: info

      api: yes
      apiAddress: :9997

      rtmp: yes
      rtmpAddress: :1935

      hls: yes
      hlsAddress: :8888
      hlsVariant: mpegts
      hlsAlwaysRemux: yes
      hlsSegmentCount: 7
      hlsSegmentDuration: 2s
      hlsAllowOrigins: ['*']

      rtsp: no
      webrtc: no
      srt: no

      pathDefaults:
        record: no

      authMethod: http
      authHTTPAddress: http://replay:8090/api/live/auth
      authHTTPExclude:
        - action: read
        - action: playback
        - action: api
        - action: metrics
        - action: pprof

      paths:
        '~^live/[^/]+$':
          source: publisher

  # Inlined Caddyfile so this stack is self-contained — Komodo only needs to
  # ship the compose file, no sibling Caddyfile on the host.
  #
  # CANONICAL SOURCE: ./Caddyfile in the repo. If you edit the Caddy config,
  # edit that file first and copy the body into the `content:` block below.
  # docker-compose.yml (NVIDIA variant) still bind-mounts ./Caddyfile
  # directly, so keeping the repo copy authoritative avoids drift.
  caddy_config:
    content: |
      {
          auto_https off
          admin off
          servers {
              max_header_size 64KB
          }
      }

      :80 {
          encode zstd gzip

          @vod_hls_segment {
              path_regexp vod_hls ^/api/matches/([^/]+)/hls/([^/]+)/(.+\.(ts|m4s|mp4))$
          }
          handle @vod_hls_segment {
              rewrite * /videos/{re.vod_hls.1}/hls/{re.vod_hls.2}/{re.vod_hls.3}
              header Cache-Control "public, max-age=31536000, immutable"
              header Access-Control-Allow-Origin "*"
              root * /data
              file_server {
                  precompressed br gzip
              }
          }

          @vod_hls_playlist {
              path_regexp vod_hls_pl ^/api/matches/([^/]+)/hls/([^/]+)/(.+\.m3u8)$
          }
          handle @vod_hls_playlist {
              rewrite * /videos/{re.vod_hls_pl.1}/hls/{re.vod_hls_pl.2}/{re.vod_hls_pl.3}
              header Cache-Control "public, max-age=60, must-revalidate"
              header Access-Control-Allow-Origin "*"
              header Content-Type "application/vnd.apple.mpegurl"
              root * /data
              file_server
          }

          handle {
              reverse_proxy replay:8090 {
                  flush_interval -1
                  transport http {
                      read_buffer 64KB
                      write_buffer 64KB
                  }
                  header_up Host {host}
                  header_up X-Real-IP {remote_host}
                  header_up X-Forwarded-For {remote_host}
                  header_up X-Forwarded-Proto {scheme}
              }
          }

          log {
              output stdout
              format console
              level INFO
          }
      }

volumes:
  # Caddy persists ACME state and its own config here. Tiny — kept on the
  # default Docker volume root rather than the SSD bind, since none of it is
  # performance-sensitive.
  replay_caddy_data:
  replay_caddy_config:

# replay_data is intentionally not declared here — the replay service uses a
# host bind-mount at /mnt/apps_ssd/apps/replay rather than a named volume.
