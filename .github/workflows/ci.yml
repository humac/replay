name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile check
        run: |
          python3 -m py_compile server.py
          python3 -m py_compile media.py
          python3 -m py_compile models.py
          python3 -m py_compile db.py
          python3 -m py_compile auth.py
          python3 -m py_compile settings.py
          python3 -m py_compile uploads.py
          python3 -m py_compile log.py
          python3 -m py_compile live.py
          python3 -m py_compile streams.py
      - name: Run tests
        env:
          REPLAY_DATA_DIR: ${{ runner.temp }}/replay_data
          ADMIN_USER: admin
          ADMIN_PASS: admin
          # GitHub-hosted runners have ~14 GB free; the production default
          # of 20 GiB is too high and was causing intermittent 507s on the
          # upload-session tests. The env var seeds the `min_free_disk_bytes`
          # setting on first boot.
          MIN_FREE_DISK_BYTES: "1048576"
        # --cov-fail-under=60 gates against significant regressions; the
        # current baseline (Apr 2026) is ~64% with tests/ excluded via
        # .coveragerc. Raise once media.py / server.py grow more coverage.
        run: pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=60

  build-and-push:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
