name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile check
        run: |
          python3 -m py_compile server.py
          python3 -m py_compile media.py
          python3 -m py_compile models.py
          python3 -m py_compile db.py
          python3 -m py_compile auth.py
          python3 -m py_compile settings.py
          python3 -m py_compile uploads.py
          python3 -m py_compile log.py
      - name: Run tests
        env:
          REPLAY_DATA_DIR: ${{ runner.temp }}/replay_data
          ADMIN_USER: admin
          ADMIN_PASS: admin
        run: pytest tests/ -v
