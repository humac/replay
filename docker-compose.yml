services:
  replay:
    image: ghcr.io/humac/replay:latest
    # Uncomment to build locally instead of pulling from GHCR:
    build: .
    container_name: replay
    # No public `ports:` — Caddy is the single entry point. Other compose
    # services reach this app via `replay:8091` on the internal network.
    expose:
      - "8091"
    env_file:
      - .env.local
    environment:
      REPLAY_PORT: 8091
      REPLAY_DATA_DIR: /data
      TMPDIR: /tmp/ffmpeg
      MAX_UPLOAD_SIZE_BYTES: 12884901888
      TRANSCODE_CONCURRENCY: 2
      # NVIDIA GPU — comment the next two lines out when switching to Intel iGPU
      NVIDIA_VISIBLE_DEVICES: GPU-26ddab77-c658-9829-0ace-90674c97dc87
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Live streaming — internal addresses for the mediamtx sidecar
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      MEDIAMTX_API_URL: http://mediamtx:9997
    volumes:
      - replay_data:/data
      # Intel GPU (VAAPI / QSV) — uncomment to expose the iGPU render node
      # - /dev/dri:/dev/dri
    # Intel GPU (VAAPI / QSV) — uncomment to pass the render device through
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - "video"
    #   - "render"
    tmpfs:
      - /tmp/ffmpeg:size=20g,exec
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/api/auth/check', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # NVIDIA GPU — comment this whole `deploy:` block out when switching to
    # Intel iGPU. Intel VAAPI/QSV does not use `deploy.resources.reservations`;
    # the `devices:` + `group_add:` passthrough above is sufficient.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-26ddab77-c658-9829-0ace-90674c97dc87"]
              capabilities: [gpu, video]

  # Caddy — single public entry point. Serves VOD HLS .ts/.m4s segments
  # directly from /data via sendfile() (saturates 10 GbE) and reverse-
  # proxies everything else to the replay app on the internal network.
  # See ./Caddyfile.
  #
  # Host-published port is 8091, matching the replay app's default while
  # leaving 8090 free for other local services. Caddy listens on :80 inside
  # the container.
  #
  # /data is read-only — Caddy's persistence lives outside it (see
  # XDG_DATA_HOME / XDG_CONFIG_HOME below). Mounting a writable volume
  # under a read-only mount fails with EROFS during runc start.
  caddy:
    image: caddy:2-alpine
    container_name: replay-caddy
    environment:
      XDG_DATA_HOME: /srv/caddy-data
      XDG_CONFIG_HOME: /srv/caddy-config
    ports:
      - "8091:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - replay_data:/data:ro
      - replay_caddy_data:/srv/caddy-data
      - replay_caddy_config:/srv/caddy-config
    depends_on:
      - replay
    restart: unless-stopped

  # MediaMTX — RTMP ingest (camera push) → LL-HLS output (browser playback).
  # Only RTMP (1936) is exposed publicly; HLS and the control API stay on the
  # internal compose network and are reverse-proxied by `replay` so viewers and
  # admins only need to reach a single origin.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: replay-mediamtx
    ports:
      - "1936:1936"   # RTMP — point your camera here
    expose:
      - "8888"        # LL-HLS (internal only)
      - "9997"        # control API (internal only)
    env_file:
      - .env.local
    environment:
      # MediaMTX expands ${MTX_LIVE_AUTH_SECRET} in mediamtx.yml at startup
      # and embeds it as the password half of HTTP Basic Auth in
      # authHTTPAddress, since MediaMTX 1.18 dropped authHTTPHeaders.
      MTX_LIVE_AUTH_SECRET: ${LIVE_AUTH_SECRET}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  # Cloudflare DDNS — keeps f2014steel-live.jvhlabs.com pointing at the
  # current public IP when the home connection's IP changes. Only the
  # RTMP host needs DDNS — f2014steel.jvhlabs.com flows through a
  # Cloudflare Tunnel (cloudflared), so its A record points at Cloudflare,
  # not the home IP. RTMP can't go through the tunnel, so the camera
  # connects directly to the home IP via this DNS-only record.
  # Token comes from .env.local (CLOUDFLARE_API_TOKEN).
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: replay-cloudflare-ddns
    env_file:
      - .env.local
    environment:
      DOMAINS: f2014steel-live.jvhlabs.com
      PROXIED: "false"
      IP4_PROVIDER: cloudflare.trace
      IP6_PROVIDER: none
      UPDATE_CRON: "@every 5m"
      TZ: UTC
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt:
      - no-new-privileges:true

volumes:
  replay_data:
  replay_caddy_data:
  replay_caddy_config:
