# MediaMTX configuration for the Replay live stream.
#
# - Accepts RTMP push at rtmp://<host>:1935/live/<stream-key>
# - Publishes LL-HLS at http://mediamtx:8888/live/<stream-key>/index.m3u8
#   (internal only; viewers reach it through the replay reverse proxy)
# - Stream-key validation is delegated to the replay app via an HTTP webhook
#   so the secret can be rotated without a MediaMTX restart.

logLevel: info

api: yes
apiAddress: :9997

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
# `mpegts` (= classic HLS) is the most compatible variant — plays in HLS.js,
# Safari, and every native player without fuss. Latency is ~6–10s vs. the 2–5s
# of `lowLatency`, but LL-HLS requires exact part-duration timing that
# MediaMTX can't always hit (you'll see "part duration changed" warnings),
# which makes HLS.js silently white-screen when the timing drifts.
# Switch back to `lowLatency` once everything is stable end-to-end.
hlsVariant: mpegts
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsAllowOrigins: ['*']

rtsp: no
webrtc: no
srt: no

pathDefaults:
  record: no

# External authentication — every publish/read/api call hits this URL and
# the replay app decides allow/deny. Reads, API, metrics, and pprof originate
# from inside the compose network so they're allowed unconditionally.
authMethod: http
authHTTPAddress: http://replay:8090/api/live/auth
authHTTPExclude:
  - action: read
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

paths:
  # Single regex path: anything under "live/<stream-key>". The auth webhook
  # validates that <stream-key> matches the value persisted in the replay app's
  # settings table.
  '~^live/[^/]+$':
    source: publisher
